# Deploy Docusaurus to GitHub Pages (org site: react-native-nitro-google-sign-in.github.io)
# Prerequisite: Settings → Pages → Source: GitHub Actions
# https://github.com/react-native-nitro-google-sign-in/react-native-nitro-google-sign-in.github.io/settings/pages
name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs site
        uses: actions/checkout@v4

      - name: Checkout package repo (demo videos + compatibility)
        uses: actions/checkout@v4
        with:
          repository: react-native-nitro-google-sign-in/google-signin
          path: package
          sparse-checkout: |
            assets
            compatibility.json
          sparse-checkout-cone-mode: false

      - name: Sync package assets
        run: |
          set -euo pipefail
          mkdir -p static/video

          # Prefer package repo copy when present on default branch; else use committed file.
          if [[ -f package/compatibility.json ]]; then
            cp package/compatibility.json compatibility.json
            echo "Synced compatibility.json from package repo"
          elif [[ -f compatibility.json ]]; then
            echo "Using committed compatibility.json (not on package default branch yet)"
          else
            echo "::error::compatibility.json missing from package checkout and docs repo"
            exit 1
          fi

          if [[ -f package/assets/google-signin-android.webm ]]; then
            cp package/assets/google-signin-android.webm static/video/
          else
            echo "::warning::package/assets/google-signin-android.webm missing"
          fi

          if [[ -f package/assets/google-signin-iOS.mov ]]; then
            cp package/assets/google-signin-iOS.mov static/video/google-signin-ios.mov
          else
            echo "::warning::package/assets/google-signin-iOS.mov missing"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        env:
          DOCUSAURUS_BASE_URL: /
          PACKAGE_REPO_ROOT: ${{ github.workspace }}/package
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
